<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- SEO principal -->
    <title>Criação de Sites Profissionais e Landing Pages | DevWeb</title>
    <meta
      name="description"
      content="Criação de sites, landing pages e sistemas web em Patrocínio-MG e todo o Brasil. Sites rápidos, responsivos e prontos para o Google. A partir de R$ 690."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="author" content="DevWeb" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="DevWeb" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Criação de Sites Profissionais e Landing Pages | DevWeb" />
    <meta
      property="og:description"
      content="Landing pages, sites institucionais e sistemas web sob medida. Seu site no ar em até 7 dias, a partir de R$ 690."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevWeb: criação de sites profissionais" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Criação de Sites Profissionais e Landing Pages | DevWeb" />
    <meta
      name="twitter:description"
      content="Landing pages, sites institucionais e sistemas web sob medida. Seu site no ar em até 7 dias, a partir de R$ 690."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <!-- Ícones e manifesto -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Aplica o tema salvo antes da pintura (evita flash e mudança de layout) -->
    <script>
      try {
        if (localStorage.getItem('dw-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>

    <!-- Fontes: apenas as famílias e pesos realmente usados -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400..600&family=Space+Grotesk:wght@300..700&display=swap"
    />

    <!--structured-data-->
  </head>

    <script type="module" src="/src/main.tsx"></script>
