<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada | DevWeb</title>
    <meta name="description" content="A página que você procurou não existe ou foi movida. Volte para a página inicial da DevWeb." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #111318;
        --slate: #4b5160;
        --line: #e4e6eb;
        --grad: linear-gradient(110deg, #f14895, #e82824);
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111318; --ink: #f4f5f7; --slate: #a9afbd; --line: #2a2e38; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 400 17px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 560px; text-align: center; }
      .code {
        margin: 0;
        font: 700 clamp(96px, 24vw, 180px) / 1 system-ui, sans-serif;
        letter-spacing: -0.05em;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { margin: 8px 0 12px; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; }
      p { margin: 0 0 28px; color: var(--slate); }
      .btn {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        background: var(--grad);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      nav { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
      nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; }
      nav a { color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço que você acessou não existe ou foi movido. Que tal voltar para o início?</p>
      <a class="btn" href="/">Voltar para a página inicial</a>
      <nav aria-label="Links úteis">
        <ul>
          <li><a href="/#servicos">Serviços</a></li>
          <li><a href="/#projetos">Projetos</a></li>
          <li><a href="/#duvidas">Dúvidas frequentes</a></li>
          <li><a href="https://wa.me/5534998418664" rel="noopener">Falar no WhatsApp</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
